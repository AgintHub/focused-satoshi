        reason: This step ensures that the forum is available to users and can handle
          a large volume of traffic
        text: Deploy the forum to a production environment and configure it for scalability
          and security
      - complexity: LOW
        impact: MEDIUM
        method: Use analytics tools, such as Google Analytics, and conduct regular
          user surveys and feedback sessions
        reason: This step ensures that the forum continues to meet the needs and expectations
          of its users
        text: Monitor the forum's performance and gather user feedback to inform future
          development and improvement
    prompt: Create a community forum for users to share experiences, ask questions,
      and connect with others
  develop_nutrition_planner:
    agent: false
    description: Build a planner that recommends meals based on dietary needs and
