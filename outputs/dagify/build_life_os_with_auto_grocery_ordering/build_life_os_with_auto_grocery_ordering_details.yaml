        reason: Provides a high-level overview of the user's sleep patterns.
        text: Aggregate sleep data from the `establish_sleep_tracker` node, focusing
          on average duration, quality scores, and efficiency. Summarize this data
          into a concise string.
      - complexity: MEDIUM
